services:
  ledgerfx:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://currencyfied.com
    volumes:
      - ledgerfx-data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [ledgerfx]
volumes:
  ledgerfx-data:
  caddy-data:
