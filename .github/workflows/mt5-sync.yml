# Free automatic MT5 -> LedgerFX sync on a GitHub-hosted Windows runner.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   MT5_LOGIN, MT5_INVESTOR_PASSWORD, MT5_SERVER, LEDGERFX_INGEST_URL, LEDGERFX_INGEST_TOKEN
# The collector aborts if the session allows trading, so a master password can never be used here.
name: MT5 Auto Sync

on:
  schedule:
    - cron: "23 */2 * * *"   # every 2 hours (GitHub may delay scheduled runs)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = complete history, incremental = recent window"
        default: "incremental"
        type: choice
        options: [incremental, full]

concurrency:
  group: mt5-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r mt5-collector/requirements.txt

      - name: Install MetaTrader 5 terminal
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/auto" -Wait
          $terminal = "C:\Program Files\MetaTrader 5\terminal64.exe"
          if (-not (Test-Path $terminal)) { throw "MT5 terminal was not installed at the expected path." }
          # The installer launches a first-run terminal (account wizard). It would swallow our startup
          # config because MT5 is single-instance, so stop it before starting our own.
          Start-Sleep -Seconds 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          "MT5_TERMINAL=$terminal" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start terminal signed in (read-only) and wait for authorization
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_INVESTOR_PASSWORD: ${{ secrets.MT5_INVESTOR_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          foreach ($n in "MT5_LOGIN","MT5_INVESTOR_PASSWORD","MT5_SERVER") {
            if (-not (Get-Item "env:$n" -ErrorAction SilentlyContinue).Value) { throw "Missing repository secret for $n." }
          }
          $dir = Split-Path $env:MT5_TERMINAL
          $ini = Join-Path $env:RUNNER_TEMP "mt5-startup.ini"
          @(
            "[Common]",
            "Login=$env:MT5_LOGIN",
            "Password=$env:MT5_INVESTOR_PASSWORD",
            "Server=$env:MT5_SERVER",
            "KeepPrivate=1",
            "NewsEnable=0"
          ) | Set-Content -Path $ini -Encoding ASCII
          Start-Process -FilePath $env:MT5_TERMINAL -ArgumentList "/portable", "/config:`"$ini`""

          $authorized = $false
          $log = $null
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $log = Get-ChildItem (Join-Path $dir "logs") -Filter *.log -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log) {
              $text = Get-Content $log.FullName -Raw -ErrorAction SilentlyContinue
              if ($text -match "authorized on") { $authorized = $true; break }
            }
          }
          Remove-Item $ini -Force -ErrorAction SilentlyContinue   # never leave the password on disk

          # Show everything except the noisy first-run MQL5 example compilation.
          Write-Host "---- terminal log (without compile noise) ----"
          if ($log) {
            Get-Content $log.FullName -ErrorAction SilentlyContinue |
              Where-Object { $_ -notmatch "Compile|Compiler" } | Select-Object -First 80
          } else {
            Write-Host "No terminal log was written under $dir\logs"
            Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -First 30 Name
          }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, MainWindowTitle
          if ($authorized) { Write-Host "Terminal reported authorization." }
          else { Write-Host "WARNING: no 'authorized' line seen; trying the collector anyway (it verifies the session itself)." }

      - name: Collect and push to LedgerFX
        shell: pwsh
        env:
          LEDGERFX_INGEST_TOKEN: ${{ secrets.LEDGERFX_INGEST_TOKEN }}
          LEDGERFX_INGEST_URL: ${{ secrets.LEDGERFX_INGEST_URL }}
          SYNC_MODE: ${{ github.event.inputs.mode || 'incremental' }}
        working-directory: mt5-collector
        run: |
          $args = @("collect_mt5.py", "--mode", $env:SYNC_MODE, "--lookback-days", "30",
                    "--confirm-investor-session", "--push-url", $env:LEDGERFX_INGEST_URL,
                    "--terminal-path", $env:MT5_TERMINAL, "--no-csv")
          $code = 1
          for ($i = 1; $i -le 3; $i++) {
            python @args
            $code = $LASTEXITCODE
            if ($code -ne 1) { break }          # 0 = ok, 2 = refused (trading enabled): never retry
            Write-Host "Attempt $i failed. Retrying in 20s..."
            Start-Sleep -Seconds 20
          }
          exit $code

      - name: Capture desktop for diagnosis (failure only)
        if: failure()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path $env:RUNNER_TEMP "desktop.png"))
          Get-Process terminal64 -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, MainWindowTitle

      - name: Upload desktop screenshot (failure only, kept 1 day)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-on-failure
          path: ${{ runner.temp }}/desktop.png
          retention-days: 1
          if-no-files-found: ignore
